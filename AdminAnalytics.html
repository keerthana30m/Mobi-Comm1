<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transactions</title>
    <link rel="stylesheet" href="css/main.min.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        margin: 0;
        font-family: "Cabin", sans-serif;
        background-color: #f8f9fa;
      }
      .sidebar {
        width: 230px;
        background: linear-gradient(135deg, #4b49ac, #98bdff);
        color: #fff;
        height: 100vh;
        padding-top: 20px;
        position: fixed;
        box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      }
      .sidebar h4 {
        font-weight: 700;
        text-align: center;
        margin-bottom: 30px;
      }
      .sidebar a {
        padding: 15px 20px;
        text-decoration: none;
        display: block;
        color: #fff;
        font-size: 1rem;
        transition: background 0.3s ease, padding-left 0.3s ease;
      }
      .sidebar a:hover {
        background: rgba(255, 255, 255, 0.2);
        padding-left: 25px;
      }
      .content {
        margin-left: 230px;
        padding: 20px;
      }
      .header {
        background-color: #fff;
        border-bottom: 2px solid #4b49ac;
        padding: 15px 30px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .header .header-right {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .header .header-right button {
        border: none;
        background: none;
        font-size: 1.2rem;
        color: #4b49ac;
      }
      /* Chart Section */
      .chart-container {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }
      .chart-container h4 {
        color: #4b49ac;
        font-weight: 700;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      /* Transactions Table */
      .transactions-table-container {
        margin-top: 20px;
        padding-bottom: 40px;
      }
      .transactions-table {
        width: 100%;
        border-collapse: collapse;
        background-color: #fff;
        border: 2px solid #9e9bd3;
        table-layout: fixed;
      }
      .transactions-table th,
      .transactions-table td {
        padding: 8px 10px;
        text-align: left;
        border-bottom: 1px solid #ddd;
        word-wrap: break-word;
        vertical-align: middle;
        font-size: 0.9rem;
      }
      .transactions-table th {
        background-color: #4b49ac;
        color: #fff;
        font-weight: 600;
        white-space: nowrap;
      }
      .transactions-table tr:nth-child(even) {
        background-color: #f9f9f9;
      }
      .transactions-table tr:hover {
        background-color: #f1f1f1;
      }
      .transactions-table th:nth-child(1),
      .transactions-table td:nth-child(1) {
        width: 150px; /* Transaction ID */
      }
      .transactions-table th:nth-child(2),
      .transactions-table td:nth-child(2) {
        width: 100px; /* User ID */
      }
      .transactions-table th:nth-child(3),
      .transactions-table td:nth-child(3) {
        width: 150px; /* User Name */
      }
      .transactions-table th:nth-child(4),
      .transactions-table td:nth-child(4) {
        width: 100px; /* Amount */
      }
      .transactions-table th:nth-child(5),
      .transactions-table td:nth-child(5) {
        width: 120px; /* Payment Method */
      }
      .transactions-table th:nth-child(6),
      .transactions-table td:nth-child(6) {
        width: 180px; /* Date */
      }
      .transactions-table th:nth-child(7),
      .transactions-table td:nth-child(7) {
        width: 100px; /* Status */
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="sidebar">
      <h4><u>Power Panel</u></h4>
      <a href="AdminDashboard.html" onclick="showPage('subscribers')"
        ><i class="fas fa-users"></i> Subscribers List</a
      >
      <a href="adminplan.html" onclick="showPage('planManagement')"
        ><i class="fas fa-tasks"></i> Plan Management</a
      >
      <a href="AdminAnalytics.html" onclick="showPage('transactions')"
        ><i class="fas fa-chart-bar"></i> Transactions</a
      >
    </div>
    <div class="content">
      <div class="header">
        <div class="header-right">
          <button class="btn"><i class="fas fa-bell"></i></button>
          <div class="dropdown">
            <button
              class="btn dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <i class="fas fa-user-circle"></i> Admin
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" href="AdminAccount.html">My Account</a>
              </li>
              <li>
                <a
                  class="dropdown-item"
                  href="AdminLogin.html"
                  onclick="logout()"
                  >Log Out</a
                >
              </li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Chart Section -->
      <div class="chart-container">
        <h4><i class="fas fa-chart-bar"></i> Transaction Summary</h4>
        <canvas id="transactionChart"></canvas>
      </div>

      <!-- Transactions Table -->
      <div class="transactions-table-container">
        <table class="transactions-table">
          <thead>
            <tr>
              <th>Transaction ID</th>
              <th>User ID</th>
              <th>User Name</th>
              <th>Amount</th>
              <th>Payment Method</th>
              <th>Date</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="transactionsTableBody"></tbody>
        </table>
      </div>
    </div>

    <script>
      // Helper function to get JWT token from localStorage
      function getJwtToken() {
        return localStorage.getItem("jwt");
      }

      // Function to handle logout
      function logout() {
        localStorage.removeItem("jwt");
        window.location.href = "AdminLogin.html";
      }

      // Fetch transactions with JWT token
      async function fetchTransactions() {
        try {
          const token = getJwtToken();
          if (!token) {
            alert("Unauthorized access. Please log in as admin.");
            window.location.href = "AdminLogin.html";
            return;
          }
          const response = await fetch("http://localhost:9090/api/transactions/all", {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });
          if (!response.ok) {
            if (response.status === 403 || response.status === 401) {
              alert("Unauthorized access. Please log in as admin.");
              window.location.href = "AdminLogin.html";
              return;
            }
            throw new Error("Network response was not ok");
          }
          const transactions = await response.json();
          populateTransactionsTable(transactions);
          renderTransactionChart(transactions);
        } catch (error) {
          console.error("Error fetching transactions:", error);
          alert("Failed to fetch transactions. Please try again later.");
        }
      }

      // Populate the transactions table
      function populateTransactionsTable(transactions) {
        const tableBody = document.getElementById("transactionsTableBody");
        tableBody.innerHTML = "";

        transactions.forEach((transaction) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${transaction.transactionId}</td>
            <td>${transaction.user.userId}</td>
            <td>${transaction.user.userName}</td>
            <td>₹${transaction.amount.toFixed(2)}</td>
            <td>${transaction.paymentMethod}</td>
            <td>${new Date(transaction.transactionDate).toLocaleString()}</td>
            <td>${transaction.status}</td>
          `;
          tableBody.appendChild(row);
        });
      }

      // Render a bar chart for transactions by payment method
      function renderTransactionChart(transactions) {
        const paymentMethods = {};
        transactions.forEach((t) => {
          paymentMethods[t.paymentMethod] = (paymentMethods[t.paymentMethod] || 0) + t.amount;
        });

        const labels = Object.keys(paymentMethods);
        const data = Object.values(paymentMethods);

        const ctx = document.getElementById("transactionChart").getContext("2d");
        new Chart(ctx, {
          type: "bar", // Use "pie" for a pie chart
          data: {
            labels: labels,
            datasets: [
              {
                label: "Total Amount (₹)",
                data: data,
                backgroundColor: [
                  "rgba(75, 73, 172, 0.8)", // #4b49ac
                  "rgba(152, 189, 255, 0.8)", // #98bdff
                  "rgba(255, 183, 77, 0.8)", // #FFB74D
                  "rgba(245, 124, 0, 0.8)", // #F57C00
                ],
                borderColor: [
                  "rgba(75, 73, 172, 1)",
                  "rgba(152, 189, 255, 1)",
                  "rgba(255, 183, 77, 1)",
                  "rgba(245, 124, 0, 1)",
                ],
                borderWidth: 1,
              },
            ],
          },
          options: {
            scales: {
              y: {
                beginAtZero: true,
                title: {
                  display: true,
                  text: "Amount (₹)",
                },
              },
              x: {
                title: {
                  display: true,
                  text: "Payment Method",
                },
              },
            },
            plugins: {
              legend: {
                display: false, // Hide legend for bar chart
              },
            },
          },
        });
      }

      // Load transactions on page load
      document.addEventListener("DOMContentLoaded", fetchTransactions);

      function showPage(page) {
        console.log("Switching to page: " + page);
      }
    </script>
  </body>
</html>
