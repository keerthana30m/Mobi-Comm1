<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Plans - Mobi-Comm</title>
    <!-- Bootstrap CSS (from CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=Orbitron:wght@700&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <style>
      body {
        font-family: "Cabin", sans-serif;
        background-color: #f5f6fa;
      }
      /* Navbar Styling */
      .navbar {
        background-color: #157a6e;
        padding: 8px 20px;
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 1000;
      }
      .navbar-brand {
        font-family: "Orbitron", sans-serif;
        font-size: 28px;
        color: #fff;
        text-transform: uppercase;
      }
      .nav-links a {
        color: #fff;
        text-decoration: none;
        margin: 0 15px;
      }
      .nav-links a:hover {
        color: #f6af65;
      }
      /* Card Styling */
      .plan-card {
        margin: 15px 0;
      }
      .plan-card .card {
        border: none;
        border-radius: 15px;
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .plan-card .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      }
      .card-title {
        font-size: 1.2rem;
        font-weight: bold;
      }
      .card-subtitle {
        font-size: 1rem;
        color: #6c757d;
      }
      .buy-plan-btn {
        background-color: #157a6e;
        border: none;
        color: #fff;
        padding: 10px 20px;
        border-radius: 5px;
        transition: background-color 0.3s ease;
      }
      .buy-plan-btn:hover {
        background-color: #bc4749;
      }
      /* Footer Styling */
      .footer {
        background-color: #157a6e;
        color: white;
        padding: 40px 0;
        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="Homepage.html">Mobi-Comm</a>
        <div class="collapse navbar-collapse">
          <div class="nav-links ms-auto d-flex gap-4">
            <a href="Homepage.html">Home</a>
            <a href="PlansPage2.html">Plans</a>
            <a href="Aboutuspage.html">About Us</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content with Tabbed Plans -->
    <div class="container" style="margin-top:100px;">
      <div class="nav nav-pills justify-content-center mb-4" role="tablist">
        <button
          class="nav-link active"
          data-bs-toggle="pill"
          data-bs-target="#true5g"
        >
          True 5G
        </button>
        <button
          class="nav-link"
          data-bs-toggle="pill"
          data-bs-target="#validity"
        >
          Validity
        </button>
        <button
          class="nav-link"
          data-bs-toggle="pill"
          data-bs-target="#data"
        >
          Data
        </button>
        <button
          class="nav-link"
          data-bs-toggle="pill"
          data-bs-target="#unlimited"
        >
          Unlimited
        </button>
        <button
          class="nav-link"
          data-bs-toggle="pill"
          data-bs-target="#entertainment"
        >
          Entertainment
        </button>
        <button
          class="nav-link"
          data-bs-toggle="pill"
          data-bs-target="#annual"
        >
          Annual
        </button>
        <button
          class="nav-link"
          data-bs-toggle="pill"
          data-bs-target="#topup"
        >
          Top-up
        </button>
      </div>
      <div class="tab-content">
        <!-- Each tab pane includes a container to load cards -->
        <div class="tab-pane fade show active" id="true5g">
          <div id="true5g" class="row"></div>
        </div>
        <div class="tab-pane fade" id="validity">
          <div id="validity" class="row"></div>
        </div>
        <div class="tab-pane fade" id="data">
          <div id="data" class="row"></div>
        </div>
        <div class="tab-pane fade" id="unlimited">
          <div id="unlimited" class="row"></div>
        </div>
        <div class="tab-pane fade" id="entertainment">
          <div id="entertainment" class="row"></div>
        </div>
        <div class="tab-pane fade" id="annual">
          <div id="annual" class="row"></div>
        </div>
        <div class="tab-pane fade" id="topup">
          <div id="topup" class="row"></div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-5">
      <div class="container text-center">
        <p>© 2025 Mobi-Comm. All Rights Reserved.</p>
      </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    ></script>
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Custom Scripts -->
    <script>
      // Function to load plans and display them as cards
      function loadPlans(url, containerId) {
        fetch(url)
          .then((response) => response.json())
          .then((data) => {
            const container = document.getElementById(containerId);
            if (container) {
              container.innerHTML = "";
              data.forEach((plan) => {
                // Create card element
                const card = document.createElement("div");
                card.className = "plan-card col-md-4";
                card.innerHTML = `
                  <div class="card shadow-sm">
                    <div class="card-body">
                      <h5 class="card-title">${plan.planCategory}</h5>
                      <h3 class="card-subtitle mb-2">${plan.planName}</h3>
                      <p class="card-text"><strong>Price:</strong> ₹${plan.planPrice}</p>
                      <p class="card-text"><strong>Validity:</strong> ${plan.validityDays} days</p>
                      <p class="card-text"><strong>Data:</strong> ${plan.planData}</p>
                      <p class="card-text"><strong>Features:</strong> ${plan.features}</p>
                      <button class="buy-plan-btn" onclick="buyPlan(${plan.planPrice}, '${plan.planName}')">Buy Now</button>
                    </div>
                  </div>
                `;
                container.appendChild(card);
              });
            }
          })
          .catch((error) =>
            console.error("Error loading plans:", error)
          );
      }

      // Call loadPlans for each tab on DOMContentLoaded
      document.addEventListener("DOMContentLoaded", function () {
        loadPlans("http://localhost:9090/api/plans/true5g", "true5g");
        loadPlans("http://localhost:9090/api/plans/validity", "validity");
        loadPlans("http://localhost:9090/api/plans/data", "data");
        loadPlans("http://localhost:9090/api/plans/unlimited", "unlimited");
        loadPlans("http://localhost:9090/api/plans/entertainment", "entertainment");
        loadPlans("http://localhost:9090/api/plans/annual", "annual");
        loadPlans("http://localhost:9090/api/plans/topup", "topup");
      });

      // Razorpay integration for buying a plan
      function buyPlan(price, planName) {
        var options = {
          key: "rzp_test_JTFjJqHQh7QfNb", // Replace with your Razorpay key
          amount: price * 100, // Amount in paise
          currency: "INR",
          name: "Mobi-Comm",
          description: `Payment for ${planName}`,
          handler: function (response) {
            alert(
              "Payment Successful! Payment ID: " +
                response.razorpay_payment_id
            );
            // Further processing after successful payment
          },
          prefill: {
            name: "Customer Name",
            email: "customer@example.com",
            contact: "9999999999",
          },
          theme: {
            color: "#3399cc",
          },
        };
        var rzp = new Razorpay(options);
        rzp.open();
      }

      // Function to show a toast notification (if needed)
      function showToast(message, delay, bgColor = "#157a6e") {
        const toastContainer =
          document.getElementById("toast-container");
        const toast = document.createElement("div");
        toast.className = "toast align-items-center border-0";
        toast.style.backgroundColor = bgColor;
        toast.style.color = "white";
        toast.innerHTML = `
          <div class="d-flex">
            <div class="toast-body">${message}</div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close" style="filter: invert(1);"></button>
          </div>
        `;
        toastContainer.appendChild(toast);
        var bsToast = new bootstrap.Toast(toast, {
          delay: delay,
          autohide: true,
        });
        bsToast.show();
        toast.addEventListener("hidden.bs.toast", () =>
          toast.remove()
        );
      }
    </script>
  </body>
</html>
